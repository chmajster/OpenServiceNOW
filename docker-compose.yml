services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: opensnow
      MYSQL_USER: opensnow
      MYSQL_PASSWORD: opensnow-dev
      MYSQL_ROOT_PASSWORD: root-dev-only
    ports:
      - "127.0.0.1:3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-proot-dev-only"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - mysql-data:/var/lib/mysql

  redis:
    image: redis:8.2-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mysql-data:
