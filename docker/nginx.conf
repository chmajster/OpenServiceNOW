resolver 127.0.0.11 valid=5s ipv6=off;

upstream opensnow_api {
    zone opensnow_api 64k;
    server api:8080 resolve;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 2m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    location ~ ^/api/v1/incidents/[0-9]+/files/?$ {
        client_max_body_size 11m;
        error_page 413 = @upload_too_large;
        proxy_pass http://opensnow_api;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 35s;
    }
    location @upload_too_large {
        default_type application/json;
        return 413 '{"error":{"code":"FILE_TOO_LARGE","message":"Plik może mieć najwyżej 10 MiB; całe żądanie 11 MiB."}}';
    }
    location /api/ {
        proxy_pass http://opensnow_api;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 35s;
    }

    location /health/ {
        proxy_pass http://opensnow_api;
        proxy_set_header Host $http_host;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control no-cache;
    }
}
