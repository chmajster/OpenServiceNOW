# Optional local SMTP sink; use with compose.yaml or docker/compose.local.yaml.
# Configure SMTP in administration: host mailpit, port 1025, TLS NONE, no credentials.
# Set SMTP_ALLOW_INSECURE=true explicitly. Native runtime uses 127.0.0.1.
services:
  mailpit:
    image: axllent/mailpit:v1.29
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"
